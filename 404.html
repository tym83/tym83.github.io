<!doctype html>

<title>Moved</title>
<script>
  // kubepkg and its example repository moved to the kuberoot-dev organization.
  var p = location.pathname;
  if (/^\/kubepkg(-recipes)?(\/|$)/.test(p)) {
    location.replace("https://kuberoot-dev.github.io" + p + location.search + location.hash);
  }
</script>
<p>kubepkg moved to <a href="https://kuberoot-dev.github.io/kubepkg/">kuberoot-dev.github.io/kubepkg</a>, its example repository to <a href="https://kuberoot-dev.github.io/kubepkg-recipes/index.yaml">kuberoot-dev.github.io/kubepkg-recipes</a>.</p>
